name: 24/7 Render Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to keep Render Web Service 100% awake 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          echo "Sending keep-alive ping to Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://bd-board-result-engine-1.onrender.com/api/health)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Render Web Service is Awake and Healthy!"
          else
            echo "Status: $HTTP_STATUS - Server will be awake on next cycle."
          fi

